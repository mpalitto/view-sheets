<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel File Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            height: 100%;
            background-color: white;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
        }

        /* --- NEW: Header Bar to align Title and Controls --- */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-shrink: 0; /* Prevent this bar from shrinking */
        }

        h1 {
            color: #333;
            font-size: 1.6em;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        /* --- END NEW --- */

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .control-group input[type="number"] {
            width: 70px;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .apply-button {
            background-color: #2196F3;
            color: white;
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .apply-button:hover {
            background-color: #1976D2;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: border-color 0.3s;
            flex-shrink: 0;
        }

        .upload-area:hover {
            border-color: #999;
        }

        .upload-area.dragover {
            border-color: #4CAF50;
            background-color: #f0f8f0;
        }

        input[type="file"] {
            display: none;
        }

        .upload-button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .upload-button:hover {
            background-color: #45a049;
        }

        .file-info {
            margin-top: 15px;
            color: #666;
        }

        .sheet-tabs {
            display: flex;
            border-bottom: 2px solid #ddd;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .sheet-tab {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 14px;
            color: #666;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .sheet-tab:hover {
            background-color: #f0f0f0;
        }

        .sheet-tab.active {
            color: #4CAF50;
            border-bottom: 2px solid #4CAF50;
            margin-bottom: -2px;
        }
        
        .table-wrapper {
            position: relative;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 4px 4px;
            overflow: hidden;
            flex-grow: 1; /* Allow wrapper to fill available vertical space */
            display: flex;
        }

        .table-container {
            overflow: auto; /* This container handles the scrollbars */
            width: 100%;
            height: 100%;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14px;
            position: relative;
            table-layout: fixed; /* Crucial for resizable columns */
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            position: relative;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- STICKY HEADER & COLUMN STYLES --- */
        thead th {
            background-color: #e9e9e9;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .line-number {
            background-color: #e9e9e9;
            font-weight: 600;
            text-align: center;
            position: sticky;
            left: 0;
            z-index: 10;
            min-width: 50px;
            width: 60px; /* Give it a consistent width */
            border-left: none;
        }

        /* Ensure top-left corner cell is always on top */
        thead .line-number {
            z-index: 30;
        }
        /* --- END STICKY STYLES --- */

        .resizer {
            position: absolute;
            top: 0;
            right: -3px;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            z-index: 25;
        }

        tbody tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover td:not(.line-number) { background-color: #e8f5e9 !important; }

        .empty-cell { color: #ccc; font-style: italic; }
        .error-message { color: #f44336; margin-top: 10px; padding: 10px; background-color: #ffebee; border-radius: 4px; display: none; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .stats { text-align: center; color: #666; font-size: 14px; padding-top: 10px; flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>Excel Viewer</h1>
            <div class="controls">
                <div class="control-group">
                    <label for="rowsInput">Rows:</label>
                    <input type="number" id="rowsInput" min="10" max="5000" value="100">
                </div>
                <div class="control-group">
                    <label for="colsInput">Cols:</label>
                    <input type="number" id="colsInput" min="5" max="200" value="20">
                </div>
                <button class="apply-button" onclick="applyViewSettings()">Apply</button>
            </div>
        </div>

        <div class="upload-area" id="uploadArea">
            <label for="fileInput" class="upload-button">Choose Excel File</label>
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
            <p class="file-info">or drag and drop your file here</p>
        </div>

        <div id="sheetsContainer" style="display: none; flex-grow: 1; display: flex; flex-direction: column;">
            <div class="sheet-tabs" id="sheetTabs"></div>
            <div class="table-wrapper">
                <div class="table-container" id="tableContainer"></div>
            </div>
            <div class="stats" id="stats"></div>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        let workbook = null;
        let fullData = null;
        let maxRows = 100;
        let maxCols = 20;

        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const sheetsContainer = document.getElementById('sheetsContainer');
        const sheetTabs = document.getElementById('sheetTabs');
        const tableContainer = document.getElementById('tableContainer');
        const errorMessage = document.getElementById('errorMessage');
        const rowsInput = document.getElementById('rowsInput');
        const colsInput = document.getElementById('colsInput');
        const stats = document.getElementById('stats');

        fileInput.addEventListener('change', handleFile);
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('dragover'); });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFileSelect(files[0]);
        });

        function handleFile(e) {
            const file = e.target.files[0];
            if (file) handleFileSelect(file);
        }

        function handleFileSelect(file) {
            const validTypes = ['application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'text/csv'];
            const fileExtension = file.name.split('.').pop().toLowerCase();
            
            if (!validTypes.includes(file.type) && !['xlsx', 'xls', 'csv'].includes(fileExtension)) {
                showError('Please upload a valid Excel file (.xlsx, .xls) or CSV file.');
                return;
            }

            tableContainer.innerHTML = '<div class="loading">Loading file...</div>';
            uploadArea.style.display = 'none';
            sheetsContainer.style.display = 'flex';
            hideError();

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array' });
                    displaySheetTabs();
                    if (workbook.SheetNames.length > 0) displaySheet(workbook.SheetNames[0]);
                } catch (error) {
                    showError('Error reading file: ' + error.message);
                    sheetsContainer.style.display = 'none';
                    uploadArea.style.display = 'block';
                }
            };
            reader.onerror = function() {
                showError('Error reading file. Please try again.');
                sheetsContainer.style.display = 'none';
                uploadArea.style.display = 'block';
            };
            reader.readAsArrayBuffer(file);
        }

        function displaySheetTabs() {
            sheetTabs.innerHTML = '';
            workbook.SheetNames.forEach((sheetName, index) => {
                const tab = document.createElement('button');
                tab.className = 'sheet-tab';
                tab.textContent = sheetName;
                tab.onclick = () => displaySheet(sheetName);
                if (index === 0) tab.classList.add('active');
                sheetTabs.appendChild(tab);
            });
        }

        function displaySheet(sheetName) {
            document.querySelectorAll('.sheet-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent === sheetName);
            });
            const worksheet = workbook.Sheets[sheetName];
            fullData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
            displayTable();
        }

        function displayTable() {
            if (!fullData) {
                tableContainer.innerHTML = '<div class="loading">No data to display</div>';
                return;
            }

            const displayRows = Math.min(maxRows, fullData.length);
            const totalColsInSheet = fullData.length > 0 ? (fullData[0] || []).length : 0;
            const displayCols = Math.min(maxCols, totalColsInSheet);

            let html = '<table><thead><tr>';
            html += '<th class="line-number">#</th>'; // Top-left corner cell

            for (let col = 0; col < displayCols; col++) {
                const colLetter = String.fromCharCode(65 + col);
                html += `<th>${colLetter}</th>`;
            }
            html += '</tr></thead><tbody>';

            for (let row = 0; row < displayRows; row++) {
                html += '<tr>';
                html += `<td class="line-number">${row + 1}</td>`;
                const rowData = fullData[row] || [];
                for (let col = 0; col < displayCols; col++) {
                    const cellValue = rowData[col] !== undefined ? rowData[col] : '';
                    const displayValue = cellValue === '' ? '<span class="empty-cell">-</span>' : escapeHtml(cellValue.toString());
                    html += `<td>${displayValue}</td>`;
                }
                html += '</tr>';
            }
            html += '</tbody></table>';
            tableContainer.innerHTML = html;

            const tableElement = tableContainer.querySelector('table');
            if (tableElement) {
                makeColsResizable(tableElement);
            }

            stats.textContent = `Showing ${displayRows.toLocaleString()} of ${fullData.length.toLocaleString()} rows, and ${displayCols} of ${totalColsInSheet} columns.`;
        }
        
        function makeColsResizable(table) {
            const headers = table.querySelectorAll('th');
            let thBeingResized = null;
            let initialMouseX = 0;
            let initialThWidth = 0;

            headers.forEach(th => {
                if (th.classList.contains('line-number')) return;

                const resizer = document.createElement('div');
                resizer.className = 'resizer';
                th.appendChild(resizer);

                const mouseDownHandler = (e) => {
                    e.preventDefault();
                    thBeingResized = th;
                    initialMouseX = e.pageX;
                    initialThWidth = thBeingResized.offsetWidth;
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';

                    document.addEventListener('mousemove', mouseMoveHandler);
                    document.addEventListener('mouseup', mouseUpHandler);
                };

                const mouseMoveHandler = (e) => {
                    const deltaX = e.pageX - initialMouseX;
                    const newWidth = initialThWidth + deltaX;
                    if (newWidth > 40) { // Set a minimum column width
                        thBeingResized.style.width = `${newWidth}px`;
                    }
                };

                const mouseUpHandler = () => {
                    thBeingResized = null;
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = 'auto';
                    document.removeEventListener('mousemove', mouseMoveHandler);
                    document.removeEventListener('mouseup', mouseUpHandler);
                };
                
                resizer.addEventListener('mousedown', mouseDownHandler);
            });
        }

        function applyViewSettings() {
            const newMaxRows = parseInt(rowsInput.value);
            const newMaxCols = parseInt(colsInput.value);
            if (newMaxRows >= 10 && newMaxRows <= 5000) maxRows = newMaxRows;
            if (newMaxCols >= 5 && newMaxCols <= 200) maxCols = newMaxCols;
            if (fullData) displayTable();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function showError(message) { errorMessage.textContent = message; errorMessage.style.display = 'block'; }
        function hideError() { errorMessage.style.display = 'none'; }

        rowsInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') applyViewSettings(); });
        colsInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') applyViewSettings(); });
    </script>
</body>
</html>
