<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel File Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
        }

        /* Top header bar with title and controls */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: white;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
            min-height: 50px;
        }

        h1 {
            color: #333;
            font-size: 1.4em;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-group label {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }

        .control-group input[type="number"] {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .apply-button {
            background-color: #2196F3;
            color: white;
            padding: 5px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.3s;
        }

        .apply-button:hover {
            background-color: #1976D2;
        }

        /* Main content area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: white;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin: 40px auto;
            transition: border-color 0.3s;
            max-width: 500px;
        }

        .upload-area:hover {
            border-color: #999;
        }

        .upload-area.dragover {
            border-color: #4CAF50;
            background-color: #f0f8f0;
        }

        input[type="file"] {
            display: none;
        }

        .upload-button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .upload-button:hover {
            background-color: #45a049;
        }

        .file-info {
            margin-top: 15px;
            color: #666;
        }

        /* Table viewing area */
        #sheetsContainer {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .sheet-tabs {
            display: flex;
            border-bottom: 2px solid #ddd;
            overflow-x: auto;
            flex-shrink: 0;
            background-color: #fafafa;
        }

        .sheet-tab {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 14px;
            color: #666;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .sheet-tab:hover {
            background-color: #f0f0f0;
        }

        .sheet-tab.active {
            color: #4CAF50;
            border-bottom: 2px solid #4CAF50;
            margin-bottom: -2px;
            background-color: white;
        }
        
        /* Table wrapper - fills remaining space */
        .table-wrapper {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #ddd;
            border-top: none;
        }

        /* Scrollable table container */
        .table-container {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            position: relative;
            min-width: 100%;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 6px 10px;
            text-align: left;
            position: relative;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 80px;
        }

        /* Sticky header row */
        thead th {
            background-color: #f5f5f5;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 20;
            border-top: none;
        }

        /* Sticky row numbers column */
        .line-number {
            background-color: #f5f5f5;
            font-weight: 600;
            text-align: center;
            position: sticky;
            left: 0;
            z-index: 10;
            min-width: 50px;
            width: 50px;
            border-left: none;
        }

        /* Top-left corner cell (highest z-index) */
        thead .line-number {
            z-index: 30;
            background-color: #ececec;
        }

        .resizer {
            position: absolute;
            top: 0;
            right: -3px;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            z-index: 25;
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }

        tbody tr:hover td:not(.line-number) {
            background-color: #e8f5e9 !important;
        }

        .empty-cell {
            color: #ccc;
            font-style: italic;
        }

        /* Status bar at bottom */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background-color: #f8f8f8;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #666;
            flex-shrink: 0;
        }

        .status-left, .status-right {
            display: flex;
            gap: 20px;
        }

        .error-message {
            color: #f44336;
            margin: 20px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <!-- Header bar with title and controls -->
    <div class="header-bar">
        <h1>Excel Viewer</h1>
        <div class="controls">
            <div class="control-group">
                <label for="rowsInput">Rows:</label>
                <input type="number" id="rowsInput" min="10" max="5000" value="100">
            </div>
            <div class="control-group">
                <label for="colsInput">Cols:</label>
                <input type="number" id="colsInput" min="5" max="200" value="20">
            </div>
            <button class="apply-button" onclick="applyViewSettings()">Apply</button>
        </div>
    </div>

    <!-- Main content area -->
    <div class="main-content">
        <div class="upload-area" id="uploadArea">
            <label for="fileInput" class="upload-button">Choose Excel File</label>
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
            <p class="file-info">or drag and drop your file here</p>
        </div>

        <div id="sheetsContainer">
            <div class="sheet-tabs" id="sheetTabs"></div>
            <div class="table-wrapper">
                <div class="table-container" id="tableContainer"></div>
                <div class="status-bar">
                    <div class="status-left">
                        <span id="rowStatus">Rows: 0 / 0</span>
                        <span id="colStatus">Columns: 0 / 0</span>
                    </div>
                    <div class="status-right">
                        <span id="cellCount">0 cells</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        let workbook = null;
        let fullData = null;
        let maxRows = 100;
        let maxCols = 20;
        let currentVisibleRows = 0;
        let currentVisibleCols = 0;

        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const sheetsContainer = document.getElementById('sheetsContainer');
        const sheetTabs = document.getElementById('sheetTabs');
        const tableContainer = document.getElementById('tableContainer');
        const errorMessage = document.getElementById('errorMessage');
        const rowsInput = document.getElementById('rowsInput');
        const colsInput = document.getElementById('colsInput');
        const rowStatus = document.getElementById('rowStatus');
        const colStatus = document.getElementById('colStatus');
        const cellCount = document.getElementById('cellCount');

        fileInput.addEventListener('change', handleFile);
        uploadArea.addEventListener('dragover', (e) => { 
            e.preventDefault(); 
            uploadArea.classList.add('dragover'); 
        });
        uploadArea.addEventListener('dragleave', () => { 
            uploadArea.classList.remove('dragover'); 
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFileSelect(files[0]);
        });

        function handleFile(e) {
            const file = e.target.files[0];
            if (file) handleFileSelect(file);
        }

        function handleFileSelect(file) {
            const validTypes = ['application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'text/csv'];
            const fileExtension = file.name.split('.').pop().toLowerCase();
            
            if (!validTypes.includes(file.type) && !['xlsx', 'xls', 'csv'].includes(fileExtension)) {
                showError('Please upload a valid Excel file (.xlsx, .xls) or CSV file.');
                return;
            }

            tableContainer.innerHTML = '<div class="loading">Loading file...</div>';
            uploadArea.style.display = 'none';
            sheetsContainer.style.display = 'flex';
            hideError();

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array' });
                    displaySheetTabs();
                    if (workbook.SheetNames.length > 0) displaySheet(workbook.SheetNames[0]);
                } catch (error) {
                    showError('Error reading file: ' + error.message);
                    sheetsContainer.style.display = 'none';
                    uploadArea.style.display = 'block';
                }
            };
            reader.onerror = function() {
                showError('Error reading file. Please try again.');
                sheetsContainer.style.display = 'none';
                uploadArea.style.display = 'block';
            };
            reader.readAsArrayBuffer(file);
        }

        function displaySheetTabs() {
            sheetTabs.innerHTML = '';
            workbook.SheetNames.forEach((sheetName, index) => {
                const tab = document.createElement('button');
                tab.className = 'sheet-tab';
                tab.textContent = sheetName;
                tab.onclick = () => displaySheet(sheetName);
                if (index === 0) tab.classList.add('active');
                sheetTabs.appendChild(tab);
            });
        }

        function displaySheet(sheetName) {
            document.querySelectorAll('.sheet-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent === sheetName);
            });
            const worksheet = workbook.Sheets[sheetName];
            fullData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
            displayTable();
        }

        function displayTable() {
            if (!fullData || fullData.length === 0) {
                tableContainer.innerHTML = '<div class="loading">No data to display</div>';
                updateStatusBar(0, 0, 0, 0);
                return;
            }

            const totalRows = fullData.length;
            const maxColsInData = Math.max(...fullData.map(row => (row || []).length));
            currentVisibleRows = Math.min(maxRows, totalRows);
            currentVisibleCols = Math.min(maxCols, maxColsInData);

            let html = '<table><thead><tr>';
            html += '<th class="line-number">#</th>';

            // Column headers (A, B, C, ...)
            for (let col = 0; col < currentVisibleCols; col++) {
                const colLetter = getColumnLetter(col);
                html += `<th>${colLetter}</th>`;
            }
            html += '</tr></thead><tbody>';

            // Data rows
            for (let row = 0; row < currentVisibleRows; row++) {
                html += '<tr>';
                html += `<td class="line-number">${row + 1}</td>`;
                const rowData = fullData[row] || [];
                for (let col = 0; col < currentVisibleCols; col++) {
                    const cellValue = rowData[col] !== undefined ? rowData[col] : '';
                    const displayValue = cellValue === '' ? '<span class="empty-cell">-</span>' : escapeHtml(cellValue.toString());
                    html += `<td>${displayValue}</td>`;
                }
                html += '</tr>';
            }
            html += '</tbody></table>';
            tableContainer.innerHTML = html;

            const tableElement = tableContainer.querySelector('table');
            if (tableElement) {
                makeColsResizable(tableElement);
            }

            updateStatusBar(currentVisibleRows, totalRows, currentVisibleCols, maxColsInData);
        }

        function getColumnLetter(col) {
            let letter = '';
            while (col >= 0) {
                letter = String.fromCharCode(65 + (col % 26)) + letter;
                col = Math.floor(col / 26) - 1;
            }
            return letter;
        }

        function updateStatusBar(visibleRows, totalRows, visibleCols, totalCols) {
            rowStatus.textContent = `Rows: ${visibleRows.toLocaleString()} / ${totalRows.toLocaleString()}`;
            colStatus.textContent = `Columns: ${visibleCols} / ${totalCols}`;
            const totalCells = visibleRows * visibleCols;
            cellCount.textContent = `${totalCells.toLocaleString()} cells displayed`;
        }
        
        function makeColsResizable(table) {
            const headers = table.querySelectorAll('thead th');
            let thBeingResized = null;
            let initialMouseX = 0;
            let initialThWidth = 0;

            headers.forEach((th, index) => {
                if (th.classList.contains('line-number')) return;

                const resizer = document.createElement('div');
                resizer.className = 'resizer';
                th.appendChild(resizer);

                const mouseDownHandler = (e) => {
                    e.preventDefault();
                    thBeingResized = th;
                    initialMouseX = e.pageX;
                    initialThWidth = thBeingResized.offsetWidth;
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';

                    document.addEventListener('mousemove', mouseMoveHandler);
                    document.addEventListener('mouseup', mouseUpHandler);
                };

                const mouseMoveHandler = (e) => {
                    if (!thBeingResized) return;
                    const deltaX = e.pageX - initialMouseX;
                    const newWidth = Math.max(40, initialThWidth + deltaX);
                    thBeingResized.style.width = `${newWidth}px`;
                    thBeingResized.style.minWidth = `${newWidth}px`;
                    
                    // Apply same width to all cells in this column
                    const colIndex = Array.from(headers).indexOf(thBeingResized);
                    const cells = table.querySelectorAll(`tbody tr td:nth-child(${colIndex + 1})`);
                    cells.forEach(cell => {
                        cell.style.width = `${newWidth}px`;
                        cell.style.minWidth = `${newWidth}px`;
                    });
                };

                const mouseUpHandler = () => {
                    thBeingResized = null;
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = 'auto';
                    document.removeEventListener('mousemove', mouseMoveHandler);
                    document.removeEventListener('mouseup', mouseUpHandler);
                };
                
                resizer.addEventListener('mousedown', mouseDownHandler);
            });
        }

        function applyViewSettings() {
            const newMaxRows = parseInt(rowsInput.value);
            const newMaxCols = parseInt(colsInput.value);
            if (newMaxRows >= 10 && newMaxRows <= 5000) maxRows = newMaxRows;
            if (newMaxCols >= 5 && newMaxCols <= 200) maxCols = newMaxCols;
            if (fullData) displayTable();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) { 
            errorMessage.textContent = message; 
            errorMessage.style.display = 'block'; 
        }
        
        function hideError() { 
            errorMessage.style.display = 'none'; 
        }

        rowsInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') applyViewSettings(); 
        });
        
        colsInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') applyViewSettings(); 
        });
    </script>
</body>
</html>
